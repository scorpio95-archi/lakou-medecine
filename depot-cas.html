<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Présenter un cas — Lakou Santé Médecine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="breadcrumb">
  <a href="index.html">🏠 Lakou Médecine</a>
  <span class="sep">›</span>
  <span class="current">Présenter un cas</span>
</div>

<header>
  <a href="index.html" class="logo-link">
    <svg class="lamp-mark" viewBox="0 0 40 40" fill="none">
      <path d="M20 6l11 8-11 8-11-8 11-8z" stroke="#e8a33d" stroke-width="2"/>
      <path d="M20 22v10M14 34h12" stroke="#f2ecdd" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="logo-text">LAKOU SANTÉ<span>Médecine</span></span>
  </a>
</header>

<main class="auth-main">
  <div class="lamp-glow" style="top:-60px;"></div>
  <form class="auth-card" id="casForm" style="position:relative;z-index:2;">
    <span class="auth-tab-strip">Dossier 02</span>
    <h1>Présenter un cas</h1>
    <p class="auth-sub">Anonymisé, comme au staff — mais qui reste après la présentation.</p>

    <div class="auth-msg" id="depotMsg"></div>

    <div class="field">
      <label for="titre">Titre du cas</label>
      <input type="text" id="titre" required placeholder="ex. Cas de dengue sévère chez l'enfant">
    </div>
    <div class="field">
      <label for="resume">Présentation du cas (anonymisée)</label>
      <input type="text" id="resume" placeholder="Contexte, présentation clinique, prise en charge...">
    </div>
    <div class="field">
      <label for="image">Image ou schéma (optionnel)</label>
      <input type="file" id="image" accept="image/*">
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Présenter le cas</button>
  </form>
</main>

<footer>
  <p>Une discipline de <a href="https://lakou-sante.vercel.app/">Lakou Santé</a>, réseau <a href="https://lakou-inivesite.vercel.app/">Lakou Inivesite</a>.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="depot.js"></script>
</body>
</html>
