<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Lakou Santé Médecine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="breadcrumb">
  <a href="index.html">🏠 Lakou Médecine</a>
  <span class="sep">›</span>
  <span class="current">Connexion</span>
</div>

<header>
  <a href="index.html" class="logo-link">
    <svg class="lamp-mark" viewBox="0 0 40 40" fill="none">
      <path d="M20 6l11 8-11 8-11-8 11-8z" stroke="#e8a33d" stroke-width="2"/>
      <path d="M20 22v10M14 34h12" stroke="#f2ecdd" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="logo-text">LAKOU SANTÉ<span>Médecine</span></span>
  </a>
</header>

<main class="auth-main">
  <div class="lamp-glow" style="top:-60px;"></div>
  <form class="auth-card" id="connexionForm" style="position:relative;z-index:2;">
    <span class="auth-tab-strip">Fiche d'accès</span>
    <h1>Connexion</h1>
    <p class="auth-sub">Reviens à ton dossier — mémoires, cas et stages déposés.</p>

    <div class="auth-msg" id="authMsg"></div>

    <div class="field">
      <label for="email">Courriel</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Se connecter</button>

    <div class="auth-switch">Pas encore de compte ? <a href="inscription.html">Créer un compte</a></div>
  </form>
</main>

<footer>
  <p>Une discipline de <a href="https://lakou-sante.vercel.app/">Lakou Santé</a>, réseau <a href="https://lakou-inivesite.vercel.app/">Lakou Inivesite</a>.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
</body>
</html>
