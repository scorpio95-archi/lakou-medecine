<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Déposer un mémoire — Lakou Santé Médecine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="breadcrumb">
  <a href="index.html">🏠 Lakou Médecine</a>
  <span class="sep">›</span>
  <span class="current">Déposer un mémoire</span>
</div>

<header>
  <a href="index.html" class="logo-link">
    <svg class="lamp-mark" viewBox="0 0 40 40" fill="none">
      <path d="M20 6l11 8-11 8-11-8 11-8z" stroke="#e8a33d" stroke-width="2"/>
      <path d="M20 22v10M14 34h12" stroke="#f2ecdd" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="logo-text">LAKOU SANTÉ<span>Médecine</span></span>
  </a>
</header>

<main class="auth-main">
  <div class="lamp-glow" style="top:-60px;"></div>
  <form class="auth-card" id="memoireForm" style="position:relative;z-index:2;">
    <span class="auth-tab-strip">Dossier 01</span>
    <h1>Déposer un mémoire</h1>
    <p class="auth-sub">Une adresse fixe pour ton travail de fin d'études.</p>

    <div class="auth-msg" id="depotMsg"></div>

    <div class="field">
      <label for="titre">Titre du mémoire</label>
      <input type="text" id="titre" required>
    </div>
    <div class="field">
      <label for="annee">Année de soutenance</label>
      <input type="number" id="annee" min="1990" max="2100" placeholder="2026">
    </div>
    <div class="field">
      <label for="faculte">Faculté</label>
      <input type="text" id="faculte" placeholder="ex. FMP — Université d'État d'Haïti">
    </div>
    <div class="field">
      <label for="specialite">Spécialité / sujet</label>
      <input type="text" id="specialite" placeholder="ex. Pédiatrie, Santé maternelle...">
    </div>
    <div class="field">
      <label for="resume">Résumé</label>
      <input type="text" id="resume" placeholder="Deux ou trois phrases sur le sujet">
    </div>
    <div class="field">
      <label for="couverture">Image de couverture</label>
      <input type="file" id="couverture" accept="image/*">
    </div>
    <div class="field">
      <label for="fichier">Document (PDF)</label>
      <input type="file" id="fichier" accept="application/pdf">
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Déposer le mémoire</button>
  </form>
</main>

<footer>
  <p>Une discipline de <a href="https://lakou-sante.vercel.app/">Lakou Santé</a>, réseau <a href="https://lakou-inivesite.vercel.app/">Lakou Inivesite</a>.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="depot.js"></script>
</body>
</html>
