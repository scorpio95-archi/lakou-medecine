<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publier une opportunité — Lakou Santé Médecine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="site-header"></div>
<div class="breadcrumb">
  <a href="index.html">🏠 Lakou Médecine</a>
  <span class="sep">›</span>
  <a href="dashboard.html">Tableau de bord</a>
  <span class="sep">›</span>
  <span class="current">Nouvelle opportunité</span>
</div>

<header>
  <a href="index.html" class="logo-link">
    <svg class="lamp-mark" viewBox="0 0 40 40" fill="none">
      <path d="M20 6l11 8-11 8-11-8 11-8z" stroke="#e8a33d" stroke-width="2"/>
      <path d="M20 22v10M14 34h12" stroke="#f2ecdd" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="logo-text">LAKOU SANTÉ<span>Médecine</span></span>
  </a>
</header>

<main class="auth-main">
  <div class="lamp-glow" style="top:-60px;"></div>
  <form class="auth-card" id="opportuniteForm" style="position:relative;z-index:2;max-width:460px;">
    <span class="auth-tab-strip">🎯 Opportunités</span>
    <h1>Publier une opportunité</h1>
    <p class="auth-sub">Stage, résidence, conférence, congrès ou bourse — garde la communauté active.</p>

    <div class="auth-msg" id="authMsg"></div>

    <div class="field">
      <label for="type">Type</label>
      <select id="type" required>
        <option value="stage">Stage</option>
        <option value="residence">Résidence</option>
        <option value="conference">Conférence</option>
        <option value="congres">Congrès</option>
        <option value="bourse">Bourse</option>
      </select>
    </div>

    <div class="field">
      <label for="titre">Titre</label>
      <input type="text" id="titre" required placeholder="ex. Bourse d'échange FMP-Québec 2027">
    </div>

    <div class="field">
      <label for="organisation">Organisation (optionnel)</label>
      <input type="text" id="organisation" placeholder="ex. OMS, MSPP, université partenaire...">
    </div>

    <div class="field">
      <label for="description">Description</label>
      <textarea id="description" rows="4" placeholder="Conditions, public visé, comment postuler..."></textarea>
    </div>

    <div class="field">
      <label for="lieu">Lieu (optionnel)</label>
      <input type="text" id="lieu">
    </div>

    <div class="field">
      <label for="dateLimite">Date limite (optionnel)</label>
      <input type="date" id="dateLimite">
    </div>

    <div class="field">
      <label for="lienUrl">Lien pour postuler (optionnel)</label>
      <input type="url" id="lienUrl">
    </div>

    <div class="field">
      <label for="imageUrl">Image — URL (optionnel)</label>
      <input type="url" id="imageUrl">
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Envoyer pour validation</button>
  </form>
</main>

<footer>
  <p>Une discipline de <a href="https://lakou-sante.vercel.app/">Lakou Santé</a>, réseau <a href="https://lakou-inivesite.vercel.app/">Lakou Inivesite</a>.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
document.getElementById('opportuniteForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('authMsg');
  const btn = document.getElementById('submitBtn');

  const { data: { session } } = await window.supabaseClient.auth.getSession();
  if (!session) {
    msg.textContent = 'Connecte-toi pour publier une opportunité.';
    msg.className = 'auth-msg show error';
    return;
  }

  const titre = document.getElementById('titre').value.trim();
  if (!titre) {
    msg.textContent = 'Le titre est obligatoire.';
    msg.className = 'auth-msg show error';
    return;
  }

  const payload = {
    type: document.getElementById('type').value,
    titre,
    organisation: document.getElementById('organisation').value.trim() || null,
    description: document.getElementById('description').value.trim() || null,
    lieu: document.getElementById('lieu').value.trim() || null,
    date_limite: document.getElementById('dateLimite').value || null,
    lien_url: document.getElementById('lienUrl').value.trim() || null,
    image_url: document.getElementById('imageUrl').value.trim() || null,
    author_id: session.user.id
  };

  btn.disabled = true;
  btn.textContent = 'Envoi...';

  const { error } = await window.supabaseClient.from('opportunites').insert(payload);

  btn.disabled = false;
  btn.textContent = 'Envoyer pour validation';

  if (error) {
    msg.textContent = error.message;
    msg.className = 'auth-msg show error';
    return;
  }

  msg.textContent = 'Envoyé ! Un admin ou enseignant doit valider avant publication.';
  msg.className = 'auth-msg show ok';
  document.getElementById('opportuniteForm').reset();
});
</script>
  <script src="/shared/partials/nav.js"></script>
</body>
</html>
